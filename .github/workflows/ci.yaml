name: CI

# No ``push: main`` trigger: Publish calls this workflow as a gate on every push to main, so a
# merge runs the suite once instead of twice.
on:
  pull_request:
  # Lets Publish run this same workflow as a gate before building or publishing.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with test tooling
        run: pip install -e ".[test,optim]"

      - name: Lint with black
        run: black --check .

      # The ``slow`` marker (the M5 accuracy guard) runs in the parallel ``accuracy`` job.
      - name: Run tests
        run: pytest tests/ -m "not slow"

  # Required checks pin the job name ``test``, so the slow tests live in their own job rather
  # than under that name. Together the two jobs cover every test exactly once.
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with test tooling
        run: pip install -e ".[test,optim]"

      - name: Run slow tests (accuracy guard)
        run: pytest tests/ -m slow

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nbstripout
        run: pip install "nbstripout==0.8.2"

      # Fails if any committed notebook still carries outputs or execution counts.
      # Notebooks that deliberately keep their outputs opt out with "keep_output": true
      # in the notebook metadata, which nbstripout honours.
      - name: Verify notebooks are stripped
        run: nbstripout --verify $(git ls-files '*.ipynb')

      # --verify skips notebooks marked keep_output, so every opt-out must be allowlisted.
      - name: Check keep_output allowlist
        run: python .github/scripts/check_keep_output.py .github/keep_output_notebooks.txt $(git ls-files '*.ipynb')

      # Guards the opt-out: a "keep_output" notebook full of base64 PNGs is the one
      # thing --verify cannot catch, so cap every notebook's on-disk size.
      - name: Check notebook sizes
        env:
          MAX_KIB: 1536
        run: |
          rc=0
          for f in $(git ls-files '*.ipynb'); do
            kib=$(( $(stat -c%s "$f") / 1024 ))
            if [ "$kib" -gt "$MAX_KIB" ]; then
              echo "::error file=$f::${kib} KiB exceeds the ${MAX_KIB} KiB budget"
              rc=1
            else
              printf '%6s KiB  %s\n' "$kib" "$f"
            fi
          done
          exit $rc

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Install wheel in a clean venv and import bunobee
        run: |
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install --upgrade pip
          /tmp/clean-venv/bin/pip install dist/*.whl
          /tmp/clean-venv/bin/python -c "import bunobee; print('bunobee', bunobee.__version__)"
